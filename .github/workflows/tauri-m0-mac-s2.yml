name: Tauri M0 Mac S2

# tauri-rewrite M0（Mac）：panic=unwind 下 S2 自定义协议 3600 s soak + 内存斜率，S4 dmg 体积。
on:
  push:
    branches: [spike/tauri-m0-ci]
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      CI: "true"
      RUST_BACKTRACE: full
    defaults:
      run:
        working-directory: spikes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: rustup default stable && rustc --version && sw_vers && uname -m
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build dmg (S4)
        working-directory: spikes/m0
        run: ../node_modules/.bin/tauri build --ci --bundles dmg
      - name: Sizes (S4)
        run: |
          mkdir -p evidence
          b=m0/src-tauri/target/release/bundle
          python3 - "$b" <<'PY' | tee evidence/mac-sizes.json
          import json, os, sys, hashlib
          b = sys.argv[1]
          dmg = [os.path.join(b, 'dmg', f) for f in os.listdir(os.path.join(b, 'dmg')) if f.endswith('.dmg')][0]
          app = os.path.join(b, 'macos', 'Biu M0.app')
          total = sum(os.path.getsize(os.path.join(r, f)) for r, _, fs in os.walk(app) for f in fs if not os.path.islink(os.path.join(r, f)))
          exe = os.path.join(app, 'Contents', 'MacOS', 'biu-m0')
          print(json.dumps({'dmg': os.path.basename(dmg), 'dmg_bytes': os.path.getsize(dmg), 'dmg_mb': os.path.getsize(dmg) / 1e6,
                            'app_bytes': total, 'exe_bytes': os.path.getsize(exe),
                            'dmg_sha256': hashlib.sha256(open(dmg, 'rb').read()).hexdigest()}, indent=2))
          PY
      - run: python3 scripts/make_fixtures_mac.py m0/fixtures && mkdir -p m0/private
      - name: S2 custom protocol 3600 s soak
        run: |
          python3 scripts/fixture_server.py --fixtures m0/fixtures --log evidence/mac-server.jsonl &
          sleep 2
          ps -axo pid=,comm= | awk '/com.apple.WebKit./{print $1}' | python3 -c 'import sys,json;print(json.dumps([int(x) for x in sys.stdin.read().split()]))' > m0/private/webkit-baseline.json
          cd m0
          export BIU_SPIKE_FIXTURES=1 BIU_FIXTURES="$PWD/fixtures" BIU_LOG="$PWD/../evidence/mac-s2-custom.jsonl"
          export BIU_MODE=custom BIU_SOAK_SECONDS=3600
          set +e
          ./src-tauri/target/release/bundle/macos/'Biu M0.app'/Contents/MacOS/biu-m0 > ../evidence/mac-s2-custom-console.log 2>&1 &
          APP=$!
          python3 ../scripts/sample_memory_mac.py --pid $APP --baseline private/webkit-baseline.json --seconds 3900 --out ../evidence/mac-s2-custom-memory.jsonl &
          ( sleep 4200; kill -TERM $APP ) &
          wait $APP; code=$?
          echo "exit=$code" | tee ../evidence/mac-s2-custom-exit.txt
          cd ..
          python3 scripts/analyze_soak.py --events evidence/mac-s2-custom.jsonl --memory evidence/mac-s2-custom-memory.jsonl --server evidence/mac-server.jsonl --out evidence/mac-soak-analysis 2>&1 | tail -30
          python3 - <<'PY'
          import json, collections
          ev = [json.loads(l) for l in open('evidence/mac-s2-custom.jsonl')]
          print(dict(collections.Counter(e.get('event') for e in ev))); print('last', ev[-1])
          PY
          true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-m0-evidence
          path: spikes/evidence
