name: Release

on:
  push:
    branches: [master]
    tags:
      - "v*"
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "screenshots/**"
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel to publish"
        type: choice
        default: nightly
        options:
          - nightly
          - stable

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Biu (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            platform_key: macos-aarch64
            os: macos-15
            target: aarch64-apple-darwin
            artifact_name: biu-macos-arm64
          - name: macos-x64
            platform_key: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            artifact_name: biu-macos-x64
          - name: windows-x64
            platform_key: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: biu-windows-x64
          - name: linux-x64
            platform_key: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact_name: biu-linux-x64

    env:
      CI: "true"
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libasound2-dev libfontconfig1-dev libfreetype6-dev libgtk-3-dev \
            libssl-dev libvulkan-dev libwayland-dev libxcb1-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxdo-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libzstd-dev

      - name: Setup Rust stable
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add "${{ matrix.target }}"
          rustc --version
          cargo --version

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: biu-release-${{ matrix.target }}
          save-if: ${{ github.event_name == 'push' }}

      - name: Run workspace unit tests
        run: cargo test --workspace --locked

      - name: Build biu release binary
        run: cargo build --release --locked -p biu-gpui --bin biu --target "${{ matrix.target }}"

      - name: Package macOS app, updater archive, and DMG
        if: runner.os == 'macOS'
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          mkdir -p dist-release
          APP_DIR="dist-release/Biu.app"
          mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources"
          cp "target/${{ matrix.target }}/release/biu" "$APP_DIR/Contents/MacOS/biu"
          chmod +x "$APP_DIR/Contents/MacOS/biu"
          cp assets/icons/icon.icns "$APP_DIR/Contents/Resources/icon.icns"
          cat > "$APP_DIR/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>zh_CN</string>
            <key>CFBundleDisplayName</key><string>Biu</string>
            <key>CFBundleExecutable</key><string>biu</string>
            <key>CFBundleIconFile</key><string>icon.icns</string>
            <key>CFBundleIdentifier</key><string>com.biu.wood3n</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>Biu</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          codesign --force --deep --sign - "$APP_DIR"
          tar -C dist-release -czf "dist-release/Biu-${{ matrix.name }}.app.tar.gz" Biu.app

          STAGE_DIR="dist-release/dmg-stage"
          mkdir -p "$STAGE_DIR"
          cp -R "$APP_DIR" "$STAGE_DIR/"
          ln -s /Applications "$STAGE_DIR/Applications"
          for attempt in 1 2 3 4 5; do
            if hdiutil create \
              -volname "Biu" \
              -srcfolder "$STAGE_DIR" \
              -ov -format UDZO \
              "dist-release/Biu-${{ matrix.name }}.dmg"; then
              break
            fi
            echo "hdiutil attempt $attempt failed (Resource busy), retrying in 4s..."
            sleep 4
            [ "$attempt" -eq 5 ] && exit 1
          done
          rm -rf "$STAGE_DIR" "$APP_DIR"

      - name: Package Windows ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-release/stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/biu.exe" "dist-release/stage/Biu.exe"
          Compress-Archive -Path "dist-release/stage/*" -DestinationPath "dist-release/Biu-${{ matrix.name }}.zip" -Force
          Remove-Item -Recurse -Force dist-release/stage

      - name: Package Linux tarball
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist-release/biu
          cp "target/${{ matrix.target }}/release/biu" dist-release/biu/biu
          chmod +x dist-release/biu/biu
          cp assets/icons/icon.png dist-release/biu/icon.png
          cat > dist-release/biu/biu.desktop <<'DESKTOP'
          [Desktop Entry]
          Name=Biu
          Comment=Bilibili Music Player (Native GPUI)
          Exec=biu
          Icon=icon
          Terminal=false
          Type=Application
          Categories=AudioVideo;Audio;Player;
          DESKTOP
          tar -C dist-release -czf "dist-release/Biu-${{ matrix.name }}.tar.gz" biu
          rm -rf dist-release/biu

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist-release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release & latest.json
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate latest.json and SHA256SUMS.txt
        id: meta
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          python3 - <<'PY'
          import datetime, hashlib, json, os, re, subprocess, sys

          with open("Cargo.toml", "r", encoding="utf-8") as f:
              m = re.search(r'^version\s*=\s*"([^"]+)"', f.read(), re.M)
          version = m.group(1) if m else "2.1.0"

          repo = os.environ["REPO"]
          sha = os.environ["SHA"][:7]
          ref_type = os.environ.get("REF_TYPE", "")
          ref_name = os.environ.get("REF_NAME", "")
          input_channel = os.environ.get("INPUT_CHANNEL", "")

          if ref_type == "tag" and ref_name.startswith("v"):
              channel = "stable"
              tag = ref_name
              prerelease = "false"
              title = f"Biu {tag}"
          elif input_channel == "stable":
              channel = "stable"
              tag = f"v{version}"
              prerelease = "false"
              title = f"Biu {tag}"
          else:
              channel = "nightly"
              tag = "nightly"
              prerelease = "true"
              title = f"Biu Nightly (v{version} · {sha})"

          commit_msg = subprocess.check_output(
              ["git", "log", "-1", "--pretty=%s"], text=True
          ).strip()
          recent_log = subprocess.check_output(
              ["git", "log", "-n", "8", "--pretty=- %s (%h)"], text=True
          ).strip()

          asset_map = {
              "macos-aarch64": "Biu-macos-arm64.app.tar.gz",
              "macos-x86_64": "Biu-macos-x64.app.tar.gz",
              "windows-x86_64": "Biu-windows-x64.zip",
              "linux-x86_64": "Biu-linux-x64.tar.gz",
          }

          art_dir = "release-artifacts"
          platforms = {}
          sums = []
          for fname in sorted(os.listdir(art_dir)):
              fpath = os.path.join(art_dir, fname)
              if not os.path.isfile(fpath):
                  continue
              h = hashlib.sha256()
              with open(fpath, "rb") as fh:
                  for chunk in iter(lambda: fh.read(1024 * 1024), b""):
                      h.update(chunk)
              digest = h.hexdigest()
              sums.append(f"{digest}  {fname}\n")

          for pkey, fname in asset_map.items():
              fpath = os.path.join(art_dir, fname)
              if not os.path.isfile(fpath):
                  continue
              h = hashlib.sha256()
              with open(fpath, "rb") as fh:
                  for chunk in iter(lambda: fh.read(1024 * 1024), b""):
                      h.update(chunk)
              platforms[pkey] = {
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{fname}",
                  "sha256": h.hexdigest(),
                  "size": os.path.getsize(fpath),
              }

          manifest = {
              "version": version,
              "tag": tag,
              "channel": channel,
              "commit": sha,
              "pubDate": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "notes": commit_msg,
              "releaseUrl": f"https://github.com/{repo}/releases/tag/{tag}",
              "platforms": platforms,
          }

          with open(os.path.join(art_dir, "latest.json"), "w", encoding="utf-8") as fh:
              json.dump(manifest, fh, ensure_ascii=False, indent=2)
          with open(os.path.join(art_dir, "SHA256SUMS.txt"), "w", encoding="utf-8") as fh:
              fh.writelines(sums)
          with open("release-notes.md", "w", encoding="utf-8") as fh:
              fh.write(f"## {title}\n\n")
              fh.write(f"- **Version**: `v{version}` (`{sha}`)\n")
              fh.write(f"- **Channel**: `{channel}`\n\n")
              fh.write("### Recent Changes\n\n")
              fh.write(recent_log + "\n")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"tag={tag}\n")
              out.write(f"title={title}\n")
              out.write(f"prerelease={prerelease}\n")
              out.write(f"channel={channel}\n")
          PY

      - name: Publish or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
          TITLE: ${{ steps.meta.outputs.title }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$TAG" = "nightly" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -f nightly "$SHA"
            git push -f origin refs/tags/nightly
          fi

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "$REPO" \
              --title "$TITLE" \
              --notes-file release-notes.md \
              --prerelease="$PRERELEASE"
            gh release upload "$TAG" release-artifacts/* --repo "$REPO" --clobber
          else
            PRE_FLAG=""
            if [ "$PRERELEASE" = "true" ]; then
              PRE_FLAG="--prerelease"
            fi
            gh release create "$TAG" release-artifacts/* \
              --repo "$REPO" \
              --title "$TITLE" \
              --notes-file release-notes.md \
              $PRE_FLAG
          fi
