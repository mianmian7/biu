name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-release:
    name: Prepare Draft Release
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check tag matches app versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n 1)
          echo "tag=$TAG package.json=$pkg tauri.conf.json=$conf Cargo.toml=$cargo"
          for v in "$pkg" "$conf" "$cargo"; do
            [ "v$v" = "$TAG" ] || { echo "::error::version $v does not match tag $TAG"; exit 1; }
          done

      - name: Ensure draft release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "$TAG" --generate-notes --repo "$REPO"
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: [prepare-release]
    if: always() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CI: "true"
      HUSKY: "0"
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS arm64 hosted runners keep timing out in the queue; cross-compile both arches on Intel.
          - name: macos-arm64
            os: macos-15-intel
            target: aarch64-apple-darwin
            bundles: app,dmg
            arch_label: arm64
          - name: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
            arch_label: x64
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            arch_label: x64
          - name: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundles: nsis
            arch_label: arm64
          - name: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            arch_label: x64
            deb_arch: amd64
            appimage_arch: x86_64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,appimage
            arch_label: arm64
            deb_arch: arm64
            appimage_arch: arm64
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Configure Git to use HTTPS instead of SSH
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Install Linux dependencies (including gst-libav)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config \
            patchelf \
            libfuse2 \
            gstreamer1.0-libav \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good

      - name: Setup Rust stable
        run: |
          rustup default stable
          rustup target add "${{ matrix.target }}"
          rustc --version
          cargo --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Import Mac signing certificate
        if: runner.os == 'macOS'
        env:
          CERT_P12: ${{ secrets.BIU_MAC_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.BIU_MAC_CERT_PASSWORD }}
        run: |
          test -n "$CERT_P12" || { echo "::error::BIU_MAC_CERT_P12 is not set"; exit 1; }
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain plugins/mac/biu-codesign.cer
          kc="$RUNNER_TEMP/biu-signing.keychain-db"
          kpw=$(openssl rand -hex 16); echo "::add-mask::$kpw"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/biu-codesign.p12"
          security create-keychain -p "$kpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kpw" "$kc"
          security import "$RUNNER_TEMP/biu-codesign.p12" -k "$kc" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kpw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/biu-codesign.p12"
          security find-identity -v -p codesigning | grep -q '"Biu Self-Signed Code Signing"'

      - name: Build Tauri bundles (${{ matrix.name }})
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && 'Biu Self-Signed Code Signing' || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm exec tauri build --ci --bundles "${{ matrix.bundles }}" --target "${{ matrix.target }}"

      - name: Verify Mac signature
        if: runner.os == 'macOS'
        run: |
          app="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Biu.app"
          codesign -dv --verbose=2 "$app" 2>&1 | grep -q 'Authority=Biu Self-Signed Code Signing' || { echo "::error::$app not signed with Biu Self-Signed Code Signing"; exit 1; }
          codesign -dv --verbose=2 "$app" 2>&1 | grep -q 'Identifier=com.biu.wood3n' || { echo "::error::$app identifier is not com.biu.wood3n"; exit 1; }
          codesign -d -r- "$app" 2>&1 | grep -q 'certificate leaf = H"9580df080e5d6f3d1470e970ced966286a529b3c"' || { echo "::error::$app designated requirement does not pin the Biu certificate that v1.16.1-autolyrics.6 requires"; exit 1; }
          codesign --verify --deep --strict "$app"

      - name: Stage release assets (${{ matrix.name }})
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir -p release-assets

          if [ "${{ runner.os }}" = "macOS" ]; then
            dmg_file=$(ls "$BUNDLE_DIR"/dmg/*.dmg | head -n 1)
            cp "$dmg_file" "release-assets/Biu-${VERSION}-mac-${{ matrix.arch_label }}.dmg"
            ditto -c -k --keepParent "$BUNDLE_DIR/macos/Biu.app" "release-assets/Biu-${VERSION}-mac-${{ matrix.arch_label }}.zip"
            cp "$BUNDLE_DIR/macos/Biu.app.tar.gz" "release-assets/Biu-${VERSION}-mac-${{ matrix.arch_label }}.app.tar.gz"
            cp "$BUNDLE_DIR/macos/Biu.app.tar.gz.sig" "release-assets/Biu-${VERSION}-mac-${{ matrix.arch_label }}.app.tar.gz.sig"
          elif [ "${{ runner.os }}" = "Windows" ]; then
            exe_file=$(ls "$BUNDLE_DIR"/nsis/*-setup.exe | head -n 1)
            cp "$exe_file" "release-assets/Biu-${VERSION}-win-setup-${{ matrix.arch_label }}.exe"
            cp "${exe_file}.sig" "release-assets/Biu-${VERSION}-win-setup-${{ matrix.arch_label }}.exe.sig"
          elif [ "${{ runner.os }}" = "Linux" ]; then
            deb_file=$(ls "$BUNDLE_DIR"/deb/*.deb | head -n 1)
            appimage_file=$(ls "$BUNDLE_DIR"/appimage/*.AppImage | head -n 1)
            cp "$deb_file" "release-assets/Biu-${VERSION}-linux-${{ matrix.deb_arch }}.deb"
            cp "$appimage_file" "release-assets/Biu-${VERSION}-linux-${{ matrix.appimage_arch }}.AppImage"
            cp "${appimage_file}.sig" "release-assets/Biu-${VERSION}-linux-${{ matrix.appimage_arch }}.AppImage.sig"
          fi
          ls -lh release-assets/

      - name: Upload staged release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.name }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish Release
    runs-on: ubuntu-24.04
    needs: build
    env:
      BRIDGE_TAG: v1.16.1-autolyrics.7
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Download all staged release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      # Electron clients read latest*.yml: they are sent to the bridge release, which exports
      # their login and then reads tauri*.yml. See docs/plans/tauri-lean.md (第 4 步审查修复).
      - name: Download bridge release feeds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p bridge-feeds
          gh release download "$BRIDGE_TAG" --repo "$REPO" --pattern 'latest*.yml' --dir bridge-feeds
          ls -l bridge-feeds/

      - name: Generate Tauri latest.json, tauri*.yml and bridge latest*.yml feeds
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          [ "v$VERSION" = "$TAG" ] || { echo "::error::version $VERSION does not match tag $TAG"; exit 1; }
          node scripts/electron-updater-feed.mjs \
            --dir release-assets \
            --out-dir release-assets \
            --version "$VERSION" \
            --tag "$TAG" \
            --repo-url "https://github.com/${REPO}" \
            --bridge-dir bridge-feeds \
            --bridge-tag "$BRIDGE_TAG"
          grep -q "^version: $VERSION$" release-assets/tauri-mac.yml
          grep -q "\"version\": \"$VERSION\"" release-assets/latest.json
          grep -q "^tag: $BRIDGE_TAG$" release-assets/latest-mac.yml
          ls -lh release-assets/

      - name: Upload assets to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release upload "$TAG" release-assets/* --clobber --repo "$REPO"

      - name: Publish release (remove draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --repo "${{ github.repository }}"

      - name: Mark as stable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --prerelease=false --repo "${{ github.repository }}"

      - name: Mark as latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --latest --repo "${{ github.repository }}"
