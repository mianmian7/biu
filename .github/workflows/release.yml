name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      HUSKY: 0
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-latest, ubuntu-latest]
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js lts
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Configure Git to use HTTPS instead of SSH
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # electron-builder 的 CSC_LINK 自建 keychain 在 macos-26 上 set-key-partition-list 解锁失败，
      # 所以自己建 keychain 导入证书，只给 electron-builder 传 CSC_NAME（见 docs/plans/seamless-update.md 步骤 1 结果）。
      - name: Import Mac signing certificate
        if: runner.os == 'macOS'
        env:
          CERT_P12: ${{ secrets.BIU_MAC_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.BIU_MAC_CERT_PASSWORD }}
        run: |
          test -n "$CERT_P12" || { echo "::error::BIU_MAC_CERT_P12 is not set"; exit 1; }
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain plugins/mac/biu-codesign.cer
          kc="$RUNNER_TEMP/biu-signing.keychain-db"
          kpw=$(openssl rand -hex 16); echo "::add-mask::$kpw"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/biu-codesign.p12"
          security create-keychain -p "$kpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kpw" "$kc"
          security import "$RUNNER_TEMP/biu-codesign.p12" -k "$kc" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kpw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/biu-codesign.p12"
          security find-identity -v -p codesigning | grep -q '"Biu Self-Signed Code Signing"'

      - name: Build & Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_NAME: ${{ runner.os == 'macOS' && 'Biu Self-Signed Code Signing' || '' }}
        run: pnpm build

      - name: Verify Mac signature
        if: runner.os == 'macOS'
        run: |
          for app in dist/artifacts/mac/Biu.app dist/artifacts/mac-arm64/Biu.app; do
            codesign -dv --verbose=2 "$app" 2>&1 | grep -q 'Authority=Biu Self-Signed Code Signing' || { echo "::error::$app not signed with Biu Self-Signed Code Signing"; exit 1; }
            codesign -d -r- "$app" 2>&1 | grep -q 'certificate leaf = H"' || { echo "::error::$app designated requirement is not certificate-based"; exit 1; }
            codesign --verify --deep --strict "$app"
          done

  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Publish release (remove draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --repo "${{ github.repository }}"
      - name: Mark as stable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --prerelease=false --repo "${{ github.repository }}"
      - name: Mark as latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --latest --repo "${{ github.repository }}"
