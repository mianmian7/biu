name: Tauri Build

on:
  push:
    branches: [feat/tauri, master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "screenshots/**"
      - ".github/workflows/release.yml"
      - ".github/workflows/eslint-review.yml"
      - ".github/workflows/knip-report.yml"
  pull_request:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "screenshots/**"
      - ".github/workflows/release.yml"
      - ".github/workflows/eslint-review.yml"
      - ".github/workflows/knip-report.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Tauri (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native Apple Silicon runner. If it keeps sitting in the queue, switch back to macos-15-intel (cross-compile).
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
            artifact_name: biu-macos-arm64-dmg
            bundle_glob: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
            artifact_name: biu-macos-x64-dmg
            bundle_glob: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact_name: biu-windows-x64-nsis
            bundle_glob: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          - name: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundles: nsis
            artifact_name: biu-windows-arm64-nsis
            bundle_glob: src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          - name: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            artifact_name: biu-linux-x64-bundles
            bundle_glob: |
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,appimage
            artifact_name: biu-linux-arm64-bundles
            bundle_glob: |
              src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/deb/*.deb
              src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
    env:
      CI: "true"
      HUSKY: "0"
      CARGO_INCREMENTAL: "0"
      # Branch and PR builds skip LTO for speed. Pushes to master keep the release profile from Cargo.toml,
      # so the cache they save matches release.yml (tag runs can only restore caches from the default branch).
      CARGO_PROFILE_RELEASE_LTO: ${{ github.ref == 'refs/heads/master' && 'true' || 'false' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ github.ref == 'refs/heads/master' && '1' || '16' }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Configure Git to use HTTPS instead of SSH
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Install Linux dependencies (including gst-libav)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config \
            patchelf \
            libfuse2 \
            gstreamer1.0-libav \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good

      - name: Setup Rust stable
        run: |
          rustup default stable
          if [ -n "${{ matrix.target }}" ]; then rustup target add "${{ matrix.target }}"; fi
          rustc --version
          cargo --version

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          shared-key: tauri-${{ matrix.target }}
          save-if: ${{ github.event_name == 'push' }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build Tauri bundles (${{ matrix.bundles }})
        env:
          CI: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          pnpm exec tauri build --ci \
            --bundles "${{ matrix.bundles }}" \
            --target "${{ matrix.target }}" \
            --config '{"bundle":{"createUpdaterArtifacts":false,"macOS":{"signingIdentity":"-"}}}' \
            -- --locked

      - name: Print bundle byte sizes
        run: |
          python3 - <<'PY' || python - <<'PY'
          import glob, os, sys

          patterns = [
              "src-tauri/target/*/release/bundle/dmg/*.dmg",
              "src-tauri/target/*/release/bundle/nsis/*.exe",
              "src-tauri/target/*/release/bundle/deb/*.deb",
              "src-tauri/target/*/release/bundle/appimage/*.AppImage",
          ]
          found = []
          for pat in patterns:
              for path in sorted(glob.glob(pat)):
                  size = os.path.getsize(path)
                  found.append({"file": os.path.basename(path), "path": path, "bytes": size})
                  print(f"[BUNDLE_SIZE] {path}: {size} bytes ({size / (1024 * 1024):.2f} MiB)")

          if not found:
              print("No bundles found!", file=sys.stderr)
              sys.exit(1)

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as fh:
                  fh.write("### Bundle Byte Sizes\n\n| File | Bytes | MiB |\n| --- | ---: | ---: |\n")
                  for item in found:
                      fh.write(f"| `{item['file']}` | `{item['bytes']}` | `{item['bytes'] / (1024 * 1024):.2f}` |\n")
          PY

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.bundle_glob }}
          if-no-files-found: error
          retention-days: 7
