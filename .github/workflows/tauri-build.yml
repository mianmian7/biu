name: Tauri Build

on:
  push:
    branches: [feat/tauri]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Tauri (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-26
            bundles: dmg
            artifact_name: biu-macos-arm64-dmg
            bundle_glob: src-tauri/target/release/bundle/dmg/*.dmg
          - name: windows-x64
            os: windows-latest
            bundles: nsis
            artifact_name: biu-windows-x64-nsis
            bundle_glob: src-tauri/target/release/bundle/nsis/*-setup.exe
          - name: linux-x64
            os: ubuntu-24.04
            bundles: deb,appimage
            artifact_name: biu-linux-x64-bundles
            bundle_glob: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
    env:
      CI: "true"
      HUSKY: "0"
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Configure Git to use HTTPS instead of SSH
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Install Linux dependencies (including gst-libav)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config \
            patchelf \
            libfuse2 \
            gstreamer1.0-libav \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good

      - name: Setup Rust stable
        run: |
          rustup default stable
          rustc --version
          cargo --version

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build Tauri bundles (${{ matrix.bundles }})
        env:
          CI: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: pnpm exec tauri build --ci --bundles "${{ matrix.bundles }}"

      - name: Print bundle byte sizes
        run: |
          python3 - <<'PY' || python - <<'PY'
          import glob, json, os, sys

          patterns = [
              "src-tauri/target/release/bundle/dmg/*.dmg",
              "src-tauri/target/release/bundle/nsis/*.exe",
              "src-tauri/target/release/bundle/deb/*.deb",
              "src-tauri/target/release/bundle/appimage/*.AppImage",
          ]
          found = []
          for pat in patterns:
              for path in sorted(glob.glob(pat)):
                  size = os.path.getsize(path)
                  found.append({"file": os.path.basename(path), "path": path, "bytes": size})
                  print(f"[BUNDLE_SIZE] {path}: {size} bytes ({size / (1024 * 1024):.2f} MiB)")

          if not found:
              print("No bundles found!", file=sys.stderr)
              sys.exit(1)

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as fh:
                  fh.write("### Bundle Byte Sizes\n\n| File | Bytes | MiB |\n| --- | ---: | ---: |\n")
                  for item in found:
                      fh.write(f"| `{item['file']}` | `{item['bytes']}` | `{item['bytes'] / (1024 * 1024):.2f}` |\n")
          PY

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.bundle_glob }}
          if-no-files-found: error
          retention-days: 7
