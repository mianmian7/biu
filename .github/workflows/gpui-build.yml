name: GPUI Build

on:
  push:
    branches: [feat/gpui]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "screenshots/**"
      - ".github/workflows/tauri-build.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/eslint-review.yml"
      - ".github/workflows/knip-report.yml"
  pull_request:
    branches: [feat/gpui, master]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "src/assets/icons/logo.svg"
      - "src-tauri/icons/**"
      - ".github/workflows/gpui-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build GPUI (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            artifact_name: biu-gpui-macos-arm64
            dist_glob: dist-gpui/*.dmg
          - name: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            artifact_name: biu-gpui-macos-x64
            dist_glob: dist-gpui/*.dmg
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: biu-gpui-windows-x64
            dist_glob: dist-gpui/*.zip
          - name: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact_name: biu-gpui-linux-x64
            dist_glob: dist-gpui/*.tar.gz

    env:
      CI: "true"
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libasound2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgtk-3-dev \
            libssl-dev \
            libvulkan-dev \
            libwayland-dev \
            libxcb1-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxdo-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libzstd-dev

      - name: Setup Rust stable
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add "${{ matrix.target }}"
          rustc --version
          cargo --version

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: gpui-${{ matrix.target }}
          save-if: ${{ github.event_name == 'push' }}

      - name: Run workspace unit tests
        run: cargo test --workspace --locked

      - name: Build biu-gpui release binary
        run: cargo build --release --locked -p biu-gpui --target "${{ matrix.target }}"

      - name: Package macOS app & DMG
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist-gpui
          APP_DIR="dist-gpui/Biu GPUI.app"
          mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources"
          cp "target/${{ matrix.target }}/release/biu-gpui" "$APP_DIR/Contents/MacOS/biu-gpui"
          chmod +x "$APP_DIR/Contents/MacOS/biu-gpui"
          cp src-tauri/icons/icon.icns "$APP_DIR/Contents/Resources/icon.icns"
          cat > "$APP_DIR/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>zh_CN</string>
            <key>CFBundleDisplayName</key><string>Biu GPUI</string>
            <key>CFBundleExecutable</key><string>biu-gpui</string>
            <key>CFBundleIconFile</key><string>icon.icns</string>
            <key>CFBundleIdentifier</key><string>com.biu.wood3n.gpui</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>Biu GPUI</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>2.1.0</string>
            <key>CFBundleVersion</key><string>2.1.0</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          codesign --force --deep --sign - "$APP_DIR"
          STAGE_DIR="dist-gpui/dmg-stage"
          mkdir -p "$STAGE_DIR"
          cp -R "$APP_DIR" "$STAGE_DIR/"
          ln -s /Applications "$STAGE_DIR/Applications"
          hdiutil create \
            -volname "Biu GPUI" \
            -srcfolder "$STAGE_DIR" \
            -ov -format UDZO \
            "dist-gpui/Biu-GPUI-${{ matrix.name }}.dmg"
          rm -rf "$STAGE_DIR" "$APP_DIR"

      - name: Package Windows ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-gpui/stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/biu-gpui.exe" "dist-gpui/stage/Biu GPUI.exe"
          Compress-Archive -Path "dist-gpui/stage/*" -DestinationPath "dist-gpui/Biu-GPUI-${{ matrix.name }}.zip" -Force
          Remove-Item -Recurse -Force dist-gpui/stage

      - name: Package Linux tarball
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist-gpui/biu-gpui
          cp "target/${{ matrix.target }}/release/biu-gpui" dist-gpui/biu-gpui/biu-gpui
          chmod +x dist-gpui/biu-gpui/biu-gpui
          cp src-tauri/icons/icon.png dist-gpui/biu-gpui/icon.png
          cat > dist-gpui/biu-gpui/biu-gpui.desktop <<'DESKTOP'
          [Desktop Entry]
          Name=Biu GPUI
          Comment=Bilibili Music Player (Native GPUI)
          Exec=biu-gpui
          Icon=icon
          Terminal=false
          Type=Application
          Categories=AudioVideo;Audio;Player;
          DESKTOP
          tar -C dist-gpui -czf "dist-gpui/Biu-GPUI-${{ matrix.name }}.tar.gz" biu-gpui
          rm -rf dist-gpui/biu-gpui

      - name: Print artifact sizes
        run: |
          python3 - <<'PY' || python - <<'PY'
          import glob, os, sys

          files = sorted(glob.glob("dist-gpui/*"))
          if not files:
              print("No artifacts found!", file=sys.stderr)
              sys.exit(1)

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          lines = ["### GPUI Artifact Sizes\n\n| File | Bytes | MiB |\n| --- | ---: | ---: |\n"]
          for path in files:
              size = os.path.getsize(path)
              name = os.path.basename(path)
              print(f"[ARTIFACT_SIZE] {path}: {size} bytes ({size / (1024 * 1024):.2f} MiB)")
              lines.append(f"| `{name}` | `{size}` | `{size / (1024 * 1024):.2f}` |\n")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.writelines(lines)
          PY

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.dist_glob }}
          if-no-files-found: error
          retention-days: 14
