[package]
name = "biu-m0"
version = "0.0.1"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "json", "stream"] }
reqwest_cookie_store = "0.8"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
http-range = "0.1"
symphonia = { version = "0.5", default-features = false, features = ["isomp4", "aac", "flac"] }
rubato = "0.16"
lofty = "0.22"
walkdir = "2"
fontdb = "0.23"
md5 = "0.7"
hmac = "0.12"
sha2 = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
pbkdf2 = "0.12"
mp4 = "0.14"
url = "2"
log = "0.4"
uuid = { version = "1", features = ["v4"] }

souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_Shell", "Win32_System_Com", "Win32_Foundation"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
