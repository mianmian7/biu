[package]
name = "biu-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
biu-audio = { path = "../biu-audio" }
biu-core = { path = "../biu-core" }
dirs.workspace = true
global-hotkey.workspace = true
gpui-kit.workspace = true
image.workspace = true
log.workspace = true
open.workspace = true
qrcode.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
smallvec = "1"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tray-icon.workspace = true
url.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSWindow", "NSApplication", "NSRunningApplication", "NSResponder", "NSView", "NSColor", "NSGraphics"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
