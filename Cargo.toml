[workspace]
resolver = "2"
members = [
    "crates/biu-core",
    "crates/biu-audio",
    "crates/biu-gpui",
]
exclude = ["src-tauri"]

[workspace.package]
version = "2.1.0-gpui"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
cookie_store = "0.21"
cpal = "0.18"
dirs = "7"
futures = "0.3"
global-hotkey = "0.10"
gpui-kit = { version = "0.11.0", default-features = false, features = ["component", "assets", "x11"] }
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
libc = "0.2"
lofty = "0.22"
log = "0.4"
md-5 = "0.10"
open = "5"
qrcode = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "json", "stream", "socks"] }
reqwest_cookie_store = "0.8"
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }
symphonia = { version = "0.6.1", features = ["all"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "process", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tray-icon = "0.27"
url = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
